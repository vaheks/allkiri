# Weekly update pull requests, one per ecosystem.
#
# The workflows pin every action to a commit with its release in a comment;
# Dependabot moves the commit and the comment together. composer.lock is not
# committed, because this is a library, so Composer updates arrive only when a
# release falls outside a constraint in composer.json.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
