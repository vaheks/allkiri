name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every action is pinned to a commit, with its release in a comment, so a moved
# tag cannot change what runs here. Dependabot updates both together; see
# .github/dependabot.yml.

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          # zip is for the test suite only; the library uses zlib, which is
          # compiled in. See the Requirements section of the README.
          extensions: curl, dom, mbstring, openssl, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Coding standard
        run: composer cs:check

      - name: Static analysis
        run: composer phpstan

      - name: Unit tests
        run: composer test:unit

  browser:
    name: Browser helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Pinned matrices, no dependencies: catches a regression on its own.
      - name: QR golden tests
        run: node tests/js/qr-golden.mjs

      # What the helper does with answers it cannot read. A misconfigured log
      # path once made a successful login look like a failed one, because an
      # unparseable body was taken for "not finished yet".
      - name: Browser helper contract
        run: node tests/js/http-contract.mjs

      # The Smart-ID QR loop: one link request at a time, cancelled on stop,
      # and a page's own abort signal honoured.
      - name: Device-link QR loop
        run: node tests/js/device-link-qr.mjs

      # Every web-eid.js 2.x error code gets someone who can act on it.
      - name: Web eID errors
        run: node tests/js/web-eid-errors.mjs

      # The one that matters: everything this encoder makes is read back by a
      # decoder that had no hand in making it. A reversed generator polynomial
      # passes every structural check and scans as nothing.
      - name: QR round trip through an independent decoder
        run: |
          npm install --no-save --no-audit --no-fund jsqr
          node tests/js/qr-roundtrip.mjs
